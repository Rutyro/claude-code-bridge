[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-bridge-mcp"
dynamic = ["version"]
description = "MCP bridge for coding-agent sessions over SSH"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rutyro" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
cc-peer = "cc_peer:main"

[project.urls]
Homepage = "https://rutyro.github.io/"
Repository = "https://github.com/Rutyro/claude-code-bridge"

[tool.setuptools]
py-modules = ["cc_peer"]

[tool.setuptools.dynamic]
version = { attr = "cc_peer.VERSION" }
